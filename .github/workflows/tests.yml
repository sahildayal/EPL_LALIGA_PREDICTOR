# Test suite, on every push and pull request.
#
# The point is not code hygiene. The staking, grading and settlement code runs
# unattended every week against a ledger that is committed back to main, so a
# regression that lands on Thursday is a regression that silently mis-grades a
# matchweek on Tuesday. This is the gate in front of that.
name: tests

on:
  push:
    branches: [main]
    paths-ignore:
      # The matchweek bot commits only these; running the suite on its own
      # commits would burn minutes to test data it just wrote.
      - "data/processed/season_ledger.json"
      - "data/processed/matchweek_logs/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      # Deliberately a bare `pytest`. Scope lives in pytest.ini, so this command
      # means the same thing here as it does on a developer machine — when CI
      # and local differ, the local one is the one you start trusting.
      #
      # No secrets are provided, so anything reaching for the network must
      # already be mocked. A test that only passes with live credentials cannot
      # gate a deploy. Archived World Cup-era tests live in scratch/legacy/ and
      # are excluded; see that directory's README.
      - name: Test suite
        run: python -m pytest -q
