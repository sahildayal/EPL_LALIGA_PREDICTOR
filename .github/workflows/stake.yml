# Price the fixtures in the next 7 days and place bets. Three passes a week.
#
# Friday prices the weekend. Sunday prices the week ahead while those markets
# are newly listed and thin — the one genuine far-out edge so far (Espanyol v
# Elche, placed five days before kickoff) came from a Sunday pass. Tuesday
# prices midweek rounds and gives the coming weekend a mid-week look. None of
# this changes any arm's threshold, and `place_arm`'s `held` filter
# (src/market/arms.py) means a later pass can never re-bet a market an arm
# already holds.
#
# GitHub starts scheduled jobs ~4h late (median 4.1h this season), so these
# cron times are set early on purpose: Friday lands around midday, Sunday and
# Tuesday around 10:00, all ahead of that day's kickoffs. Until 2026-09-25 the
# Sunday pass was scheduled for 12:00 and landed ~15:30, mid-matchday; combined
# with a kickoff read 3-4h late, that is how it bet matches already in play.
# The drift no longer matters for correctness — every guard is keyed on each
# fixture's real kickoff — only for how many fixtures are still bettable.
name: Matchweek — stake

on:
  schedule:
    - cron: "0 9 * * 5"        # Friday — lands ~13:00
    - cron: "0 6 * * 0"        # Sunday — lands ~10:00, before Sunday kickoffs
    - cron: "0 6 * * 2"        # Tuesday — lands ~10:00, before midweek kickoffs
  workflow_dispatch:
    inputs:
      dry_run:
        description: Price and log the plan without staking anything
        type: boolean
        default: false

# A reusable workflow can only narrow the caller's token, never widen it, so
# these must be granted here as well as in _matchweek.yml.
permissions:
  contents: write
  issues: write

jobs:
  stake:
    uses: ./.github/workflows/_matchweek.yml
    with:
      job: stake
      # A dry run must never write the ledger, or "dry" would be a lie.
      commit: ${{ !inputs.dry_run }}
      dry_run: ${{ inputs.dry_run == true }}
    secrets:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
      KALSHI_PRIVATE_KEY_PEM: ${{ secrets.KALSHI_PRIVATE_KEY_PEM }}

  # New bets need a closing price. Start a closer now rather than wait for its
  # cron, so a bet on a fixture a few hours out is watched from the moment it
  # is placed. Skipped when the stake run failed or was a dry run.
  wake-closer:
    needs: stake
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run closer.yml --repo "${{ github.repository }}"
