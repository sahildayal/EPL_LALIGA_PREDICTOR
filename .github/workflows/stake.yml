# Friday: price the matchweek and place this week's bets. Sunday: re-price
# the same 7-day window and stake anything that has since crossed a threshold.
#
# 09:00 UTC on Friday is chosen to sit ahead of the earliest kickoff of the
# weekend. EPL and La Liga both schedule Friday-night fixtures (20:00 UK /
# 21:00 CET), so a Friday-evening run would price part of the matchweek after
# it had started.
#
# The Sunday run exists because Kalshi asks drift between Friday morning and
# kickoff, and a single weekly stake pass means any edge that opens up after
# Friday goes uncaptured until the following Friday — by which point the
# fixture has usually already been played. Sunday 12:00 UTC sits ahead of
# Sunday-evening kickoffs and after the Saturday slate, giving a second look
# at whatever's left in the window without changing any arm's threshold.
# `place_arm` already guards against staking a fixture+market an arm holds
# from Friday (see the `held` filter in src/market/arms.py), so this cannot
# double-bet a market Friday already took.
#
# Note the schedule is UTC year-round while the leagues run on local time, so
# these fire an hour "later" in local terms once the clocks go back. That
# margin is generous enough that this never matters for either run.
name: Matchweek — stake

on:
  schedule:
    - cron: "0 9 * * 5"        # Fridays 09:00 UTC
    - cron: "0 12 * * 0"       # Sundays 12:00 UTC — catches post-Friday drift
  workflow_dispatch:
    inputs:
      dry_run:
        description: Price and log the plan without staking anything
        type: boolean
        default: false

# A reusable workflow can only narrow the caller's token, never widen it, so
# these must be granted here as well as in _matchweek.yml.
permissions:
  contents: write
  issues: write

jobs:
  stake:
    uses: ./.github/workflows/_matchweek.yml
    with:
      job: stake
      # A dry run must never write the ledger, or "dry" would be a lie.
      commit: ${{ !inputs.dry_run }}
      dry_run: ${{ inputs.dry_run == true }}
    secrets:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
      KALSHI_PRIVATE_KEY_PEM: ${{ secrets.KALSHI_PRIVATE_KEY_PEM }}
