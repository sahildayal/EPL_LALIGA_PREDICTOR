# Manual, one-off maintenance against the ledger. Not scheduled.
#
# Runs a named script under scripts/ and commits what it changed. Each script is
# single-use and gets deleted (with this workflow) once it has run in
# production — this is infrastructure for running one safely, on the same
# versioned code path as every other job, not a permanent admin console.
name: Maintenance

on:
  workflow_dispatch:
    inputs:
      script:
        description: Path under scripts/ to run, e.g. void_unidentified_fit.py
        required: true
        type: string

permissions:
  contents: write

concurrency:
  # Shares the ledger with the matchweek jobs, so it must not interleave.
  group: matchweek-ledger
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run script
        run: PYTHONPATH="$PWD" python "scripts/${{ inputs.script }}"

      - name: Rebuild dashboard
        continue-on-error: true
        run: python scripts/build_site.py

      - name: Commit
        run: |
          git config user.name  "matchweek-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/processed/season_ledger.json docs
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -m "chore(maintenance): run ${{ inputs.script }} [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
