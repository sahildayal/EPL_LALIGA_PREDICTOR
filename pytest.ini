[pytest]
# The live suite is scratch/. scratch/legacy/ holds archived World Cup-era tests
# that hit live feeds and assert pre-rebuild behaviour — see its README.
#
# Excluded here rather than in the CI command on purpose: a bare `pytest` must
# mean the same thing on your machine as it does in Actions. When the two differ,
# the one you run locally is the one you start trusting.
testpaths = scratch
norecursedirs = legacy .git .* build dist *.egg venv .venv data docs

# Fail on an unregistered marker rather than silently skipping the test.
addopts = --strict-markers
